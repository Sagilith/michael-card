name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode media
        run: |
          cat media/michael-wave.mp4.b64.0 media/michael-wave.mp4.b64.1 media/michael-wave.mp4.b64.2 media/michael-wave.mp4.b64.3 | base64 -d > michael-wave.mp4
          base64 -d media/michael-wave-poster.jpg.b64 > michael-wave-poster.jpg
          rm -rf media
          ls -la michael-wave.mp4 michael-wave-poster.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
